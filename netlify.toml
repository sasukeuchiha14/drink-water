[build]
  base = "frontend"
  command = "npm run check && npm run build"
  publish = "dist"
  # Rebuild when the shared icon or Windows version changes outside frontend.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# API rewrites precede the website alias redirect so either host can answer.
[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/version"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/hi"
  to = "https://drinkwater.hardikgarg.me/"
  status = 301
  force = true

[[redirects]]
  from = "/hi/*"
  to = "https://drinkwater.hardikgarg.me/"
  status = 301
  force = true

[[redirects]]
  from = "https://drink-water.hardikgarg.me/*"
  to = "https://drinkwater.hardikgarg.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/download"
  to = "https://github.com/sasukeuchiha14/drink-water/releases/latest/download/DrinkWater-Setup.exe"
  status = 302
  force = true

# Response headers are generated in dist/_headers with the structured-data hash.
